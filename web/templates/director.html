{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Race Director Panel</h1>
    <p class="subtle">Main event control is handled through the Discord Race Director panel. This page is for visibility only.</p>
</div>

<div class="card" id="director-live-box">
    <p>Loading live race control data...</p>
</div>

<script>
async function loadDirectorPage() {
    try {
        const response = await fetch("/api/dashboard/live");
        const data = await response.json();
        const box = document.getElementById("director-live-box");

        if (!data.event) {
            box.innerHTML = "<p>No active or scheduled event right now.</p>";
            return;
        }

        box.innerHTML = `
            <h2>${data.event.name}</h2>
            <div class="pill">${data.event.series}</div>
            <div class="pill">${data.event.class_name}</div>
            <div class="pill">Track: ${data.event.track_name}</div>
            <div class="pill">Status: ${data.event.status}</div>
            <div class="pill">Queue: ${data.event.queue_total ?? 0}</div>
            <div class="pill">Created By: ${data.event.created_by_name ?? "Unknown"}</div>
        `;
    } catch (err) {
        document.getElementById("director-live-box").innerHTML = "<p>Failed to load director data.</p>";
    }
}
loadDirectorPage();
setInterval(loadDirectorPage, 5000);
</script>
{% endblock %}
