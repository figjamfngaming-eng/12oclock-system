{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1 class="title">My Rider Profile</h1>
    <p class="sub">Set your race identity for website + Discord registration.</p>

    <form method="post">
        <div>
            <label>Discord Name</label>
            <input type="text" value="{{ profile.discord_name }}" disabled>
        </div>
        <div>
            <label>MX Bikes Name</label>
            <input type="text" name="mxb_name" value="{{ profile.mxb_name or '' }}">
        </div>
        <div>
            <label>Steam ID</label>
            <input type="text" name="steam_id" value="{{ profile.steam_id or '' }}">
        </div>
        <div>
            <label>Team Name</label>
            <input type="text" name="team_name" value="{{ profile.team_name or '' }}">
        </div>
        <div>
            <label>Rider Number</label>
            <input type="text" name="rider_number" value="{{ profile.rider_number or '' }}">
        </div>
        <button class="btn primary" type="submit">Save Profile</button>
    </form>
</div>
{% endblock %}
