{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:760px;">
    <h1 class="title">Profile</h1>
    <p class="sub">Link your Discord account to your MX Bikes rider identity.</p>

    <form method="post">
        <div>
            <label>Discord Name</label>
            <input type="text" value="{{ profile.discord_name }}" disabled>
        </div>

        <div>
            <label>MX Bikes Rider Name</label>
            <input type="text" name="mxb_name" value="{{ profile.mxb_name or '' }}" placeholder="Enter your in-game rider name">
        </div>

        <div>
            <label>Steam ID / Steam Profile URL</label>
            <input type="text" name="steam_id" value="{{ profile.steam_id or '' }}" placeholder="Optional">
        </div>

        <button class="btn primary" type="submit">Save Profile</button>
    </form>
</div>
{% endblock %}
