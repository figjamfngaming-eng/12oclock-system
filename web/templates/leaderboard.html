{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Leaderboard</h2>
    {% if rows %}
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Rider</th>
                <th>Class</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rows %}
            <tr>
                <td>#{{ loop.index }}</td>
                <td>{{ r.mxb_name }}</td>
                <td>{{ r.class_name }}</td>
                <td>{{ r.pts }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No leaderboard data yet.</p>
    {% endif %}
</div>
{% endblock %}
