{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Leaderboard</h1>
    <table>
        <thead><tr><th>Rider</th><th>Class</th><th>Points</th></tr></thead>
        <tbody>
        {% for r in rows %}
            <tr><td>{{ r.mxb_name }}</td><td>{{ r.class_name }}</td><td>{{ r.pts }}</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
