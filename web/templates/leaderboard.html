{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Leaderboard</h1>
    {% if leaderboard %}
    <table>
        <thead>
            <tr>
                <th>Rider</th>
                <th>Class</th>
                <th>Total Points</th>
                <th>Races</th>
            </tr>
        </thead>
        <tbody>
        {% for r in leaderboard %}
            <tr>
                <td>{{ r.mxb_name }}</td>
                <td>{{ r.class_name }}</td>
                <td>{{ r.total_points }}</td>
                <td>{{ r.races_entered }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No leaderboard data yet.</p>
    {% endif %}
</div>
{% endblock %}
