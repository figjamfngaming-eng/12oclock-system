{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1 class="title">Admin Panel V2</h1>
    <p class="sub">Manage events, gate picks, and protests.</p>
    {% if message %}<div class="flash">{{ message }}</div>{% endif %}
</div>

<div class="section grid two">
    <div class="card">
        <h2>Create Event</h2>
        <form method="post">
            <input type="hidden" name="action" value="create_event">
            <div><label>Event Name</label><input type="text" name="name" required></div>
            <div><label>Track</label><input type="text" name="track" required></div>
            <div>
                <label>Class</label>
                <select name="class_name" required>
                    <option value="450">450</option>
                    <option value="250">250</option>
                    <option value="Open">Open</option>
                </select>
            </div>
            <div><label>Season</label><input type="text" name="season" value="{{ default_season }}" required></div>
            <div><label>Round</label><input type="number" name="round_number" value="1" min="1" required></div>
            <button class="btn primary" type="submit">Create Event</button>
        </form>
    </div>

    <div class="card">
        <h2>Event Controls</h2>
        <form method="post">
            <input type="hidden" name="action" value="close_event">
            <div>
                <label>Close Event</label>
                <select name="event_id" required>
                    {% for e in events %}
                    <option value="{{ e.id }}">ID {{ e.id }} — {{ e.name }} — {{ e.status }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn primary" type="submit">Close Event</button>
        </form>
        <hr style="margin:18px 0;border-color:rgba(255,255,255,.08);">
        <form method="post">
            <input type="hidden" name="action" value="draw_gates">
            <div>
                <label>Randomize Gate Picks</label>
                <select name="event_id" required>
                    {% for e in events %}
                    <option value="{{ e.id }}">ID {{ e.id }} — {{ e.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn primary" type="submit">Draw Gates</button>
        </form>
    </div>
</div>

<div class="section">
    <div class="card">
        <h2>Resolve Protests</h2>
        <form method="post">
            <input type="hidden" name="action" value="resolve_protest">
            <div>
                <label>Protest</label>
                <select name="protest_id" required>
                    {% for p in protests %}
                    <option value="{{ p.id }}">#{{ p.id }} — {{ p.rider_name }} vs {{ p.against_rider }} — {{ p.status }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Status</label>
                <select name="status" required>
                    <option value="open">Open</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="reviewed">Reviewed</option>
                </select>
            </div>
            <div>
                <label>Admin Note</label>
                <textarea name="admin_note"></textarea>
            </div>
            <button class="btn primary" type="submit">Update Protest</button>
        </form>
    </div>
</div>
{% endblock %}
