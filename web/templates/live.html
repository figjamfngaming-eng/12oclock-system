{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Live Race Results</h1>
    <p class="subtle">Updates every 5 seconds.</p>
</div>
<div class="card" id="live-results-box"><p>Loading live results...</p></div>
<script>
async function loadLiveResultsPage() {
    try {
        const response = await fetch("/api/live_results");
        const data = await response.json();
        const box = document.getElementById("live-results-box");
        if (!data.event) {
            box.innerHTML = "<p>No live event right now.</p>";
            return;
        }
        let html = `<h2>${data.event.name}</h2><div class="pill">${data.event.series}</div><div class="pill">${data.event.class_name}</div><div class="pill">Track: ${data.event.track_name}</div>`;
        if (!data.results.length) {
            html += "<p style='margin-top:12px;'>No live standings yet.</p>";
            box.innerHTML = html;
            return;
        }
        html += `<table><thead><tr><th>Pos</th><th>Rider</th><th>Laps</th><th>Best Lap</th><th>Gap</th><th>Status</th></tr></thead><tbody>`;
        for (const row of data.results) {
            html += `<tr><td>${row.position ?? ""}</td><td>${row.rider_name ?? ""}</td><td>${row.laps ?? 0}</td><td>${row.best_lap ?? ""}</td><td>${row.gap ?? ""}</td><td>${row.status ?? ""}</td></tr>`;
        }
        html += "</tbody></table>";
        box.innerHTML = html;
    } catch (err) {
        document.getElementById("live-results-box").innerHTML = "<p>Failed to load live results.</p>";
    }
}
loadLiveResultsPage();
setInterval(loadLiveResultsPage, 5000);
</script>
{% endblock %}
