{% extends "base.html" %}
{% block content %}
<div id="d"></div>
<script>
async function l(){
let r=await fetch('/api/live');
let d=await r.json();
let h='';
d.forEach(x=>h+=x.gate_order+" "+x.mxb_name+"<br>");
document.getElementById("d").innerHTML=h;
}
setInterval(l,2000);
l();
</script>
{% endblock %}
