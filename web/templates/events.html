{% extends "base.html" %}{% block content %}<div class="card"><h1>Events</h1><table><tr><th>ID</th><th>Series</th><th>Class</th><th>Track</th><th>Status</th><th>Queue</th><th>Start</th></tr>{% for e in events %}<tr><td><a href="/event/{{ e.id }}">#{{ e.id }}</a></td><td>{{ e.series }}</td><td>{{ e.class_name }}</td><td>{{ e.track_name }}</td><td>{{ e.status }}</td><td>{{ e.queue_total }}</td><td>{{ e.start_time }}</td></tr>{% endfor %}</table></div>{% endblock %}
