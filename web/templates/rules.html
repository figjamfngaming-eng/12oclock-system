{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1 class="title">League Rules</h1>
    <p class="sub">Official race rules for the 12 O'Clock Boyz MX Bikes league.</p>

    <div class="list">
        {% for rule in rules %}
            <div class="list-item">{{ loop.index }}. {{ rule }}</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
