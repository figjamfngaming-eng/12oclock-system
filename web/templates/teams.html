{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1 class="title">Team Standings</h1>
    <p class="sub">Combined championship points by team.</p>
</div>

<div class="section">
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Team</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ r.team_name }}</td>
                    <td>{{ r.total_points }}</td>
                </tr>
                {% else %}
                <tr><td colspan="3">No team standings yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
