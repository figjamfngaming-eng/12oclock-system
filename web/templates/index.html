{% extends "base.html" %}
{% block content %}

<div class="card">
    <h1>MX Bikes League - 12 O’Clock Boyz</h1>

    <p class="subtle">
        Join the 12 O’Clock Boyz MX Bikes league. Compete in MXGP and SMX races,
        earn points, and take the 1W championship.
    </p>

    <div style="margin-top:15px;">
        <a class="btn btn-discord" href="{{ discord_invite_url }}" target="_blank">Join Discord</a>
        <a class="btn" href="/events">Events</a>
        <a class="btn" href="/leaderboard">Leaderboard</a>
    </div>
</div>

<div class="stats">
    <div class="card">
        <div class="subtle">Riders</div>
        <div class="stat-number">{{ riders_total }}</div>
    </div>

    <div class="card">
        <div class="subtle">Events</div>
        <div class="stat-number">{{ events_total }}</div>
    </div>
</div>

{% endblock %}
