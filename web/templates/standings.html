{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Standings — {{ cls }}</h1>
  <div class="row">
    <a class="pill" href="{{ url_for('standings', cls='450') }}">450</a>
    <a class="pill" href="{{ url_for('standings', cls='250') }}">250</a>
    <a class="pill" href="{{ url_for('standings', cls='250-2t') }}">250 2T</a>
  </div>

  <div class="table">
    <div class="tr head">
      <div>#</div><div>Rider</div><div>Discord</div><div>Points</div>
    </div>
    {% for r in rows %}
      <div class="tr">
        <div>{{ loop.index }}</div>
        <div>{{ r.rider }}</div>
        <div class="muted">{{ r.discord }}</div>
        <div><b>{{ r.points }}</b></div>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
