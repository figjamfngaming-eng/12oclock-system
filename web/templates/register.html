{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1 class="title">Race Registration</h1>
    <p class="sub">Join upcoming events and secure your place on the gate.</p>
    {% if message %}<div class="flash">{{ message }}</div>{% endif %}

    <form method="post">
        <div>
            <label>Event</label>
            <select name="event_id" required>
                {% for e in events %}
                    <option value="{{ e.id }}">ID {{ e.id }} — {{ e.name }} — {{ e.class_name }} — Round {{ e.round_number }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Rider Name</label>
            <input type="text" name="rider_name" required>
        </div>
        <div>
            <label>Team Name</label>
            <input type="text" name="team_name">
        </div>
        <button class="btn primary" type="submit">Register for Race</button>
    </form>
</div>
{% endblock %}
