<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 O'Clock Boyz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #f5f5f5;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            background: #11111a;
            border-bottom: 1px solid #2b2b3c;
        }

        .brand {
            font-size: 30px;
            font-weight: 700;
            margin: 0;
            color: #ffd54a;
        }

        .sub {
            color: #b8b8c7;
            margin-top: 6px;
        }

        .nav {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav a {
            color: #fff;
            background: #6f2cff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
        }

        .nav a:hover {
            opacity: 0.9;
        }

        .card {
            background: #151522;
            border: 1px solid #2f2f45;
            border-radius: 16px;
            padding: 18px;
            margin-top: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .stat {
            font-size: 34px;
            font-weight: 700;
            color: #ffd54a;
        }

        .muted {
            color: #b8b8c7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            border-bottom: 1px solid #2f2f45;
            padding: 12px 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: #ffd54a;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #24243a;
            color: #fff;
        }

        .approved {
            background: #155724;
        }

        .pending {
            background: #6c5a12;
        }

        .rejected {
            background: #6b1c1c;
        }

        .link {
            color: #8ecbff;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <h1 class="brand">12 O'Clock Boyz</h1>
            <div class="sub">MX Bikes League System</div>
            <div class="nav">
                <a href="/">Home</a>
                <a href="/riders">Riders</a>
                <a href="/events">Events</a>
            </div>
        </div>
    </div>

    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
