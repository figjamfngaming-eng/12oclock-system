<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 O'Clock Boyz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        .topbar {
            background: #171722;
            border-bottom: 1px solid #2e2e40;
            padding: 18px 24px;
        }
        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #ffd54a;
        }
        .nav {
            margin-top: 12px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .nav a {
            color: #c8a2ff;
            text-decoration: none;
            font-weight: bold;
        }
        .nav a:hover {
            color: #ffd54a;
        }
        .card {
            background: #1a1a26;
            border: 1px solid #2b2b3a;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .stat-number {
            font-size: 34px;
            font-weight: bold;
            color: #ffd54a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #2a2a38;
        }
        th {
            color: #ffd54a;
        }
        .btn {
            background: #6e38d5;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .btn-danger {
            background: #b33a3a;
        }
        .pill {
            display: inline-block;
            background: #26263a;
            color: #c8a2ff;
            padding: 6px 10px;
            border-radius: 999px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .subtle {
            color: #bbbbc8;
        }
        .link {
            color: #7dc4ff;
            text-decoration: none;
        }
        .live-row {
            padding: 12px;
            border-bottom: 1px solid #2a2a38;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <div class="brand">12 O'Clock Boyz</div>
            <div class="nav">
                <a href="/">Home</a>
                <a href="/events">Events</a>
                <a href="/leaderboard">Leaderboard</a>
                <a href="/director">Director</a>
                <a href="/live">Live</a>
                <a href="/status">Status</a>
            </div>
        </div>
    </div>

    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
