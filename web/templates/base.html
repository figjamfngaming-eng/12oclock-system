<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 O'Clock Boyz</title>
    <style>
        :root {
            --bg: #09070d;
            --panel: #13101a;
            --panel-2: #1a1524;
            --line: #33264a;
            --gold: #f1c75b;
            --gold-soft: #cda447;
            --purple: #7b3cff;
            --purple-soft: #a377ff;
            --text: #f5f1ff;
            --muted: #b8abc9;
            --good: #2ca56d;
            --bad: #d25555;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(123, 60, 255, 0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(241, 199, 91, 0.10), transparent 30%),
                var(--bg);
            color: var(--text);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 7, 13, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 22px;
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 14px;
        }

        .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .nav a {
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, var(--purple), #5126ad);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .nav a:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .hero {
            background: linear-gradient(135deg, rgba(123, 60, 255, 0.18), rgba(241, 199, 91, 0.08));
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .hero h2 {
            margin: 0 0 10px 0;
            font-size: 34px;
            color: var(--gold);
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.22);
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .subtle {
            color: var(--muted);
        }

        .big-stat {
            font-size: 38px;
            font-weight: 900;
            color: var(--gold);
            margin-top: 6px;
        }

        .pill {
            display: inline-block;
            margin: 0 8px 8px 0;
            padding: 7px 11px;
            background: rgba(123, 60, 255, 0.14);
            border: 1px solid rgba(163, 119, 255, 0.25);
            color: #efe7ff;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .pill.good {
            background: rgba(44, 165, 109, 0.14);
            border-color: rgba(44, 165, 109, 0.3);
        }

        .pill.bad {
            background: rgba(210, 85, 85, 0.14);
            border-color: rgba(210, 85, 85, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        th, td {
            padding: 13px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--gold);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .inline-link {
            color: #9fd4ff;
            text-decoration: none;
            font-weight: 700;
        }

        .inline-link:hover {
            text-decoration: underline;
        }

        .footer-note {
            color: var(--muted);
            text-align: center;
            padding: 16px 0 26px;
            font-size: 13px;
        }

        @media (max-width: 720px) {
            .brand-title {
                font-size: 26px;
            }

            .hero h2 {
                font-size: 28px;
            }

            .wrap {
                padding: 16px;
            }

            .card, .hero {
                padding: 16px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <div class="brand-row">
                <div class="brand">
                    <h1 class="brand-title">12 O'Clock Boyz</h1>
                    <div class="brand-sub">MX Bikes League System • MXGP • SMX • Championships</div>
                </div>
            </div>

            <div class="nav">
                <a href="/">Home</a>
                <a href="/events">Events</a>
                <a href="/riders">Riders</a>
                <a href="/leaderboard">Leaderboard</a>
                <a href="/status">Status</a>
            </div>
        </div>
    </div>

    <div class="wrap">
        {% block content %}{% endblock %}
        <div class="footer-note">12 O'Clock Boyz League System</div>
    </div>
</body>
</html>
