<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 O'Clock Boyz</title>
    <style>
        body {
            background: #0b0b0f;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            background: #11111a;
            border-bottom: 1px solid #2d2140;
            padding: 16px 24px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #f7d774;
        }

        .nav {
            margin-top: 10px;
        }

        .nav a {
            color: #c59cff;
            text-decoration: none;
            margin-right: 16px;
            font-weight: 600;
        }

        .card {
            background: #141421;
            border: 1px solid #2d2140;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .muted {
            color: #bbbbc7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2b2b38;
        }

        th {
            color: #f7d774;
        }

        .pill {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #241a35;
            color: #e3c9ff;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .big {
            font-size: 34px;
            font-weight: 700;
            color: #f7d774;
        }

        a.inline-link {
            color: #8cc8ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <div class="brand">12 O'Clock Boyz</div>
            <div class="nav">
                <a href="/">Home</a>
                <a href="/events">Events</a>
                <a href="/riders">Riders</a>
                <a href="/leaderboard">Leaderboard</a>
                <a href="/status">Status</a>
            </div>
        </div>
    </div>

    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
