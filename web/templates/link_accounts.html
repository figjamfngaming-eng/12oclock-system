{% extends "base.html" %}{% block content %}<div class="card" style="max-width:760px;margin:auto"><h1>Link Accounts</h1><p>Link Discord, Steam, and your MX Bikes rider details. Relinking is locked for 30 days after a link change.</p><p><a class="pill" href="/auth/steam">Link Steam with Steam Login</a></p><form method="post"><input name="discord_id" placeholder="Discord ID" value="{{ oauth_discord_id }}"><input name="discord_username" placeholder="Discord Username" value="{{ oauth_discord_username }}"><input name="steam_id" placeholder="Steam ID" value="{{ link_data.steam_id if link_data else '' }}"><input name="steam_name" placeholder="Steam Name" value="{{ link_data.steam_name if link_data else '' }}"><input name="rider_name" placeholder="MX Bikes Rider Name" value="{{ rider_data.mxb_name if rider_data else '' }}"><select name="rider_class"><option value="">Choose Class</option>{% for cls in ['450','250F','125','85'] %}<option value="{{ cls }}" {% if rider_data and rider_data.class_name == cls %}selected{% endif %}>{{ cls }}</option>{% endfor %}</select><input name="rider_guid" placeholder="Rider GUID" value="{{ rider_data.guid if rider_data else '' }}"><button type="submit">Save Link Details</button></form></div>{% endblock %}
