{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Create Account</h1>

    <form method="POST">
        <label>Username</label>
        <input name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button class="btn" type="submit">Sign Up</button>
    </form>
</div>
{% endblock %}
